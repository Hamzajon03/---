<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c9b296">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Блокҳои Рангин / Цветные блоки</title>
<style>
:root{--bg1:#e2d0b4;--bg2:#bfa384;--txt:#5a4330;--board:#3d2e26;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#5a4638;--bg2:#2f251d;--txt:#f0dfc8}}
:root[data-theme="dark"]{--bg1:#5a4638;--bg2:#2f251d;--txt:#f0dfc8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 0,var(--bg1),var(--bg2));font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--txt)}
#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:8px 12px 12px}
.top{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center}
.best{display:flex;align-items:center;gap:6px;font-weight:900;font-size:24px;color:#f4a62a;text-shadow:0 1px 0 #fff8}
.best svg{width:40px;height:24px}
.gear{width:46px;height:46px;border:0;background:none;font-size:34px;color:var(--txt);cursor:pointer}
.scorebox{position:relative;margin:2px 0 12px;height:104px;width:220px;display:grid;place-items:center}
.scorebox svg{position:absolute;top:0;width:128px;height:112px;opacity:.85;filter:blur(1px)}
#score{position:relative;font-size:62px;font-weight:900;background:linear-gradient(90deg,#ff7ac8,#ffd66b,#5cf2a0,#38d6ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 5px #0003)}
#score.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.18)}}
#cap{position:absolute;bottom:-4px;font-size:14px;font-weight:700;opacity:.75}
#board{display:grid;grid-template-columns:repeat(8,var(--cell));grid-template-rows:repeat(8,var(--cell));gap:2px;padding:6px;background:var(--board);border-radius:14px;box-shadow:0 0 0 4px #e8d9c2,0 10px 22px #0006,inset 0 4px 10px #000a}
#board.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.c{width:var(--cell);height:var(--cell);border-radius:6px;background:#4a392f;position:relative}
.c.on,.m{background:linear-gradient(#ffffff55,#fff0 45%),linear-gradient(145deg,#c660e6,#8a2bb0 55%,#6a1a92);box-shadow:inset 0 2px 2px #fff8,inset 0 -3px 4px #4a0a6aaa,0 1px 3px #000a}
.c.on::after,.m::after{content:"";position:absolute;inset:12%;border:1.5px dashed #ecbfff88;border-radius:20%}
.m{display:block;position:relative;border-radius:20%}
.e{visibility:hidden}
.c.pv{background:#9a3cc277}
.c.drop{animation:drop .25s}
@keyframes drop{from{transform:scale(1.3)}}
.c.clr{animation:clr .42s forwards;z-index:2}
@keyframes clr{40%{transform:scale(1.25);filter:brightness(2)}100%{transform:scale(0);opacity:0}}
#tray{display:flex;width:100%;max-width:480px;flex:1;min-height:110px}
.slot{flex:1;display:grid;place-items:center;touch-action:none}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;filter:drop-shadow(0 10px 6px #0006)}
.ov{position:fixed;inset:0;background:#2a1d1599;display:none;place-items:center;z-index:100;backdrop-filter:blur(3px)}
.ov.show{display:grid}
.panel{background:linear-gradient(#f4e8d4,#dcc6a4);border-radius:22px;padding:22px 20px 18px;width:min(88vw,360px);text-align:center;box-shadow:0 12px 40px #0009;color:#5a4330;animation:drop .3s}
.panel h2{margin:0 0 6px;font-size:22px}
.sub{font-size:15px;opacity:.85}
.btn{display:block;width:100%;margin-top:12px;padding:14px 8px;border:0;border-radius:16px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(#b84fe0,#7b21a6);box-shadow:0 4px 0 #4e1070;cursor:pointer;font-family:inherit}
.btn.alt{background:linear-gradient(#ecdcc0,#cdb48d);color:#5a4330;box-shadow:0 4px 0 #a58c68}
.btn.sel{outline:3px solid #f4a62a}
.row{display:flex;gap:10px}
#toast{position:fixed;left:50%;top:24%;transform:translateX(-50%);font-size:32px;font-weight:900;color:#fff;text-shadow:0 3px 0 #7b21a6,0 0 16px #f4a62a;pointer-events:none;opacity:0;z-index:200;white-space:nowrap}
#toast.show{animation:tst 1.1s}
@keyframes tst{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#rec{font-size:22px;font-weight:900;color:#d9780b;min-height:28px}
#eS{font-size:48px;font-weight:900;color:#7b21a6}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="best"><svg viewBox="0 0 48 28"><path d="M2 24 L6 6 L16 15 L24 2 L32 15 L42 6 L46 24Z" fill="#f7b731" stroke="#d98b0b" stroke-width="2" stroke-linejoin="round"/></svg><span id="best">0</span></div>
    <button class="gear" id="gear">⚙</button>
  </div>
  <div class="scorebox">
    <svg viewBox="0 0 100 90"><defs><radialGradient id="hg"><stop offset="0" stop-color="#ffd35a"/><stop offset="1" stop-color="#ff8a1f"/></radialGradient></defs><path d="M50 85C10 55 0 35 0 22C0 9 10 0 24 0C34 0 44 6 50 15C56 6 66 0 76 0C90 0 100 9 100 22C100 35 90 55 50 85Z" fill="url(#hg)"/></svg>
    <div id="score">0</div><div id="cap"></div>
  </div>
  <div id="board"></div>
  <div id="tray"></div>
</div>
<div id="ghost"></div><div id="toast"></div>

<div class="ov" id="ovLang"><div class="panel">
  <h2>Блокҳои Рангин<br>Цветные блоки</h2>
  <div class="sub">Забонро интихоб кунед<br>Выберите язык</div>
  <button class="btn" data-l="tg">🇹🇯 Тоҷикӣ</button>
  <button class="btn" data-l="ru">🇷🇺 Русский</button>
</div></div>

<div class="ov" id="ovSet"><div class="panel">
  <h2 id="tSet"></h2><div class="sub" id="tLang"></div>
  <div class="row"><button class="btn alt" data-l="tg">🇹🇯 Тоҷикӣ</button><button class="btn alt" data-l="ru">🇷🇺 Русский</button></div>
  <button class="btn alt" id="snd"></button>
  <button class="btn alt" id="rst"></button>
  <button class="btn" id="cls"></button>
</div></div>

<div class="ov" id="ovEnd"><div class="panel">
  <h2 id="tEnd"></h2><div id="rec"></div>
  <div class="sub" id="lS"></div><div id="eS"></div>
  <div class="sub" id="lB"></div>
  <button class="btn" id="again"></button>
</div></div>

<script>
const N=8,$=id=>document.getElementById(id);
const SH=["1","11","1/1","111","1/1/1","1111","1/1/1/1","11111","1/1/1/1/1","11/11","111/111/111","11/10","11/01","10/11","01/11","111/001","111/100","001/001/111","100/100/111","111/100/100","111/001/001","010/111","111/010"].map(s=>s.split("/").map(r=>[...r].map(Number)));
const T={
tg:{set:"Танзимот",lang:"Забон",snd:"Садо",on:"фаъол",off:"хомӯш",rst:"Нест кардани рекорд",rstd:"Рекорд нест карда шуд",cls:"Пӯшидан",best:"Беҳтарин ҳисоб",score:"Хол",end:"Бозӣ тамом шуд",rec:"Рекорди нав!",again:"Аз нав бозӣ кардан",combo:"Комбо"},
ru:{set:"Настройки",lang:"Язык",snd:"Звук",on:"вкл.",off:"выкл.",rst:"Сбросить рекорд",rstd:"Рекорд сброшен",cls:"Закрыть",best:"Рекорд",score:"Очки",end:"Игра окончена",rec:"Новый рекорд!",again:"Играть снова",combo:"Комбо"}};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const saved=ls("lang");
let L=saved==="tg"||saved==="ru"?saved:"ru",sound=ls("snd")!=="0",best=+ls("best")||0,startBest=best,score=0,combo=0,g,pcs,over=false,busy=false,cell=40,drag=null;
const bd=$("board"),cs=[];
for(let i=0;i<64;i++){const d=document.createElement("div");d.className="c";bd.appendChild(d);cs.push(d)}

function tr(){const t=T[L];document.documentElement.lang=L;
$("tSet").textContent=t.set;$("tLang").textContent=t.lang;$("snd").textContent=t.snd+": "+(sound?t.on:t.off);
$("rst").textContent=t.rst;$("cls").textContent=t.cls;$("tEnd").textContent=t.end;$("lS").textContent=t.score;
$("lB").textContent=t.best+": "+best;$("again").textContent=t.again;$("cap").textContent=t.score;$("gear").setAttribute("aria-label",t.set);
document.querySelectorAll("#ovSet [data-l]").forEach(b=>b.classList.toggle("sel",b.dataset.l===L))}

function size(){const a=Math.min(innerWidth-30,innerHeight*.5,470);cell=Math.max(26,Math.floor((a-26)/8));bd.style.setProperty("--cell",cell+"px")}
const fits=(s,r,c)=>s.every((row,i)=>row.every((v,j)=>!v||(r+i>=0&&c+j>=0&&r+i<N&&c+j<N&&!g[r+i][c+j])));
const canAny=s=>{for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fits(s,r,c))return true;return false};
const draw=()=>cs.forEach((d,k)=>d.className="c"+(g[k/N|0][k%N]?" on":""));

function pieceEl(s,z){const e=document.createElement("div");e.style.cssText=`display:grid;gap:2px;grid-template-columns:repeat(${s[0].length},${z}px)`;
s.forEach(r=>r.forEach(v=>{const m=document.createElement("i");m.className=v?"m":"m e";m.style.cssText=`width:${z}px;height:${z}px`;e.appendChild(m)}));return e}
function deal(){let p;for(let t=0;t<15;t++){p=[0,1,2].map(()=>({s:SH[Math.random()*SH.length|0],used:false}));if(p.some(x=>canAny(x.s)))break}pcs=p;tray()}
function tray(){const t=$("tray");t.innerHTML="";pcs.forEach((p,i)=>{const d=document.createElement("div");d.className="slot";
if(!p.used){d.appendChild(pieceEl(p.s,Math.floor(cell*.6)));d.onpointerdown=e=>start(e,i,d)}t.appendChild(d)})}

function start(e,i,d){if(over||busy||drag)return;e.preventDefault();ac();sfx.pick();
const s=pcs[i].s,gh=$("ghost");gh.innerHTML="";gh.appendChild(pieceEl(s,cell));
drag={i,s,d,w:s[0].length*cell+(s[0].length-1)*2,h:s.length*cell+(s.length-1)*2,ok:false};
d.firstChild.style.opacity=.2;d.setPointerCapture(e.pointerId);d.onpointermove=mv;d.onpointerup=d.onpointercancel=fin;mv(e)}
function mv(e){if(!drag)return;const x=e.clientX-drag.w/2,y=e.clientY-drag.h-38;
$("ghost").style.transform=`translate(${x}px,${y}px)`;
const o=cs[0].getBoundingClientRect(),st=cs[1].getBoundingClientRect().left-o.left;
drag.c=Math.round((x-o.left)/st);drag.r=Math.round((y-o.top)/st);
cs.forEach(c=>c.classList.remove("pv"));drag.ok=fits(drag.s,drag.r,drag.c);
if(drag.ok)drag.s.forEach((row,a)=>row.forEach((v,b)=>{if(v)cs[(drag.r+a)*N+drag.c+b].classList.add("pv")}))}
function fin(e){if(!drag)return;const{i,s,r,c,ok,d}=drag;drag=null;$("ghost").innerHTML="";cs.forEach(x=>x.classList.remove("pv"));
d.onpointermove=d.onpointerup=d.onpointercancel=null;
if(e.type==="pointerup"&&ok)place(i,s,r,c);else if(d.firstChild)d.firstChild.style.opacity=1}

function place(i,s,r,c){let n=0;s.forEach((row,a)=>row.forEach((v,b)=>{if(v){g[r+a][c+b]=1;n++}}));pcs[i].used=true;draw();
s.forEach((row,a)=>row.forEach((v,b)=>{if(v)cs[(r+a)*N+c+b].classList.add("drop")}));
const R=[],C=[];for(let k=0;k<N;k++){if(g[k].every(v=>v))R.push(k);if(g.every(row=>row[k]))C.push(k)}
const q=R.length+C.length;
if(!q){combo=0;sfx.place();vib(15);after(n);return}
combo++;busy=true;const set=new Set();
R.forEach(k=>{for(let j=0;j<N;j++)set.add(k*N+j)});C.forEach(k=>{for(let j=0;j<N;j++)set.add(j*N+k)});
set.forEach(x=>cs[x].classList.add("clr"));
const gain=n+q*q*10+(combo-1)*10;sfx.clear(q);vib(45);bd.classList.remove("shake");void bd.offsetWidth;bd.classList.add("shake");
toast(combo>1?T[L].combo+" ×"+combo+"  +"+gain:"+"+gain);
setTimeout(()=>{set.forEach(x=>g[x/N|0][x%N]=0);draw();after(gain)},430)}
function after(gain){busy=false;setScore(score+gain);
if(pcs.every(p=>p.used))deal();else tray();
if(!pcs.some(p=>!p.used&&canAny(p.s)))endGame()}
function setScore(v){score=v;const s=$("score");s.textContent=v;s.classList.remove("bump");void s.offsetWidth;s.classList.add("bump");
if(v>best){best=v;ls("best",best);$("best").textContent=best;$("lB").textContent=T[L].best+": "+best}}
function endGame(){over=true;sfx.over();setTimeout(()=>{$("eS").textContent=score;$("rec").textContent=score>startBest&&score>0?T[L].rec:"";$("lB").textContent=T[L].best+": "+best;$("ovEnd").classList.add("show")},500)}
function reset(){g=Array.from({length:N},()=>Array(N).fill(0));score=0;combo=0;over=false;busy=false;startBest=best;$("score").textContent=0;draw();deal()}
function toast(t){const e=$("toast");e.textContent=t;e.classList.remove("show");void e.offsetWidth;e.classList.add("show")}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}

let AC;function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function tone(f,d,t,v,at){if(!sound||!AC)return;const o=AC.createOscillator(),k=AC.createGain(),s=AC.currentTime+(at||0);
o.type=t;o.frequency.value=f;k.gain.setValueAtTime(v,s);k.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(k);k.connect(AC.destination);o.start(s);o.stop(s+d)}
const P=[1,1.125,1.25,1.5,1.667,2];
const sfx={pick:()=>tone(520,.07,"triangle",.1),place:()=>{tone(180,.12,"square",.08);tone(300,.1,"triangle",.1,.04)},
clear:q=>{for(let k=0;k<Math.min(3+q,6);k++)tone(440*P[k],.22,"triangle",.14,k*.06)},
over:()=>[400,330,260,180].forEach((f,k)=>tone(f,.28,"sawtooth",.09,k*.18))};

document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ac();L=b.dataset.l;ls("lang",L);tr();$("ovLang").classList.remove("show")});
$("gear").onclick=()=>{ac();tr();$("ovSet").classList.add("show")};
$("cls").onclick=()=>$("ovSet").classList.remove("show");
$("snd").onclick=()=>{sound=!sound;ls("snd",sound?1:0);tr();sfx.pick()};
$("rst").onclick=()=>{best=0;startBest=0;ls("best",0);$("best").textContent=0;tr();toast(T[L].rstd)};
$("again").onclick=()=>{ac();$("ovEnd").classList.remove("show");reset()};
document.addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("resize",()=>{size();if(pcs)tray()});

size();$("best").textContent=best;tr();reset();
if(!saved)$("ovLang").classList.add("show");
try{if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
</script>
</body>
</html>
